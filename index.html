<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FÜHLOMAT © 2026 MS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f2eb;
            color: #14321e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #faf8f5;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2ded4;
        }
        .header-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: #6b7280;
            margin-bottom: 24px;
            font-weight: 600;
        }
        h1 {
            font-size: 22px;
            color: #14321e;
            margin-bottom: 24px;
            font-weight: 700;
        }
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #c8c3b8;
            background-color: #ffffff;
            color: #14321e;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #14321e;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 28px;
        }
        .output-box {
            min-height: 90px;
            background-color: #ede8df;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1.5;
            color: #14321e;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">F Ü H L O M A T © 2026 MS</div>
    <h1>Wie fühlst du dich gerade?</h1>

    <select id="comboFeelings">
        <option value="verärgert">verärgert</option>
        <option value="lustlos">lustlos</option>
        <option value="ängstlich">ängstlich</option>
        <option value="gestresst">gestresst</option>
        <option value="unruhig">unruhig</option>
        <option value="schlaflos">schlaflos</option>
        <option value="mutlos">mutlos</option>
        <option value="traurig">traurig</option>
    </select>

    <button onclick="zeigeUebung()">Los!</button>

    <div class="output-box" id="lblAusgabe">
        Wähle ein Gefühl aus und klicke auf "Los!".
    </div>
</div>

<script>
function zeigeUebung() {
    const gefuehl = document.getElementById("comboFeelings").value;
    const zufall = Math.floor(Math.random() * 2);
    let uebung = "";

    switch (gefuehl) {
        case "verärgert":
            const uebungenVeraergert = [
                "<b>Isometric Push:</b> Drücke mit beiden Handflächen für 10s so fest wie möglich gegen eine Wand. 3x wiederholen.",
                "<b>Wut-Stampfen:</b> Stampfe 5x kräftig mit den Füßen auf den Boden und atme dabei geräuschvoll durch den Mund aus."
            ];
            uebung = uebungenVeraergert[zufall];
            break;

        case "lustlos":
            const uebungenLustlos = [
                "<b>2-Minuten-Aktivierung:</b> Mache 10 zügige Hampelmänner, um den Kreislauf schnell in Schwung zu bringen.",
                "<b>Über-Kreuz-Tappen:</b> Tippe im Stehen abwechselnd mit der rechten Hand auf das linke Knie und umgekehrt. 15x."
            ];
            uebung = uebungenLustlos[zufall];
            break;

        case "ängstlich":
            const uebungenAengstlich = [
                "<b>Physiologischer Seufzer:</b> Atme 2x kurz nacheinander durch die Nase ein, dann lange und langsam aus.",
                "<b>Hand-Press:</b> Presse die Handflächen vor der Brust fest zusammen, halte 5s und lasse langsam nach."
            ];
            uebung = uebungenAengstlich[zufall];
            break;

        case "gestresst":
            const uebungenGestresst = [
                "<b>Progressive Muskelentspannung:</b> Balle deine Hände 5s fest zu Fäusten, öffne sie dann schlagartig. 3x.",
                "<b>Box-Atmung:</b> 4s einatmen, 4s halten, 4s ausatmen, 4s halten. 3x wiederholen."
            ];
            uebung = uebungenGestresst[zufall];
            break;

        case "unruhig":
            const uebungenUnruhig = [
                "<b>5-4-3-2-1 Orientierung:</b> Benenne gedanklich 5 Dinge im Raum, 4 Geräusche, 3 Tastsensationen, 2 Gerüche, 1 Geschmack.",
                "<b>Ausschütteln:</b> Schüttele deine Hände, Arme und Beine 20s lang kräftig aus."
            ];
            uebung = uebungenUnruhig[zufall];
            break;

        case "schlaflos":
            const uebungenSchlaflos = [
                "<b>Wörter-Shuffle:</b> Stell dir ein Wort vor (z. B. 'SCHLAF') und finde zu jedem Buchstaben 3 neutrale Begriffe.",
                "<b>Bein-Wippen:</b> Leg dich flach hin, lass die Füße locker nach außen fallen und wippe 2min mit den Beinen."
            ];
            uebung = uebungenSchlaflos[zufall];
            break;

        case "mutlos":
            const uebungenMutlos = [
                "<b>Power-Posing:</b> Stell dich 1min aufrecht hin, stemm die Hände in die Hüften, Brust raus und atme tief durch.",
                "<b>Schulter-Squeeze:</b> Zieh die Schultern 5s fest zu den Ohren, halte den Atem und lasse sie beim Ausatmen schlagartig fallen. 3x."
            ];
            uebung = uebungenMutlos[zufall];
            break;

        case "traurig":
            const uebungenTraurig = [
                "<b>Selbst-Umarmung:</b> Kreuz beide Arme über der Brust, leg die Hände auf die Oberarme und streichle sanft.",
                "<b>Thymus-Klopfen:</b> Reibe oder klopfe mit den Fingerspitzen 20s sanft kreisend über dein Brustbein."
            ];
            uebung = uebungenTraurig[zufall];
            break;

        default:
            uebung = "Bitte wähle ein Gefühl aus.";
            break;
    }

    document.getElementById("lblAusgabe").innerHTML = uebung;
}
</script>

</body>
</html>
